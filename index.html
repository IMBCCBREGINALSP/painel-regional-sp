<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Regional SP — Ativo Imobilizado</title>
<meta name="robots" content="noindex,nofollow">
<style>
:root{--azul:#1f3a5f;--azul2:#2d5b94;--cinza:#f3f5f8;--borda:#d9dee6;--txt:#1d2733;--ok:#1d7a46;--err:#b3261e;--warn:#b26a00}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,Segoe UI,Roboto,sans-serif;color:var(--txt);background:var(--cinza)}
button,input,select,textarea{font:inherit}
.btn{background:var(--azul);color:#fff;border:0;border-radius:6px;padding:8px 14px;cursor:pointer}
.btn:hover{background:var(--azul2)}.btn.sec{background:#fff;color:var(--azul);border:1px solid var(--azul)}
.btn.ok{background:var(--ok)}.btn.err{background:var(--err)}.btn:disabled{opacity:.5;cursor:default}
input,select,textarea{border:1px solid var(--borda);border-radius:6px;padding:8px;background:#fff;max-width:100%}
.card{background:#fff;border:1px solid var(--borda);border-radius:10px;padding:16px;margin-bottom:14px}
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.box{width:100%;max-width:420px}
.box h1{margin:0 0 4px;font-size:20px;color:var(--azul)}
.box label{display:block;margin:12px 0 4px;font-weight:600}
.box input{width:100%}
.msg{margin-top:12px;padding:8px 10px;border-radius:6px;display:none}
.msg.err{display:block;background:#fdecea;color:var(--err)}.msg.ok{display:block;background:#e6f4ea;color:var(--ok)}
a.lnk{color:var(--azul2);cursor:pointer;text-decoration:underline}
header{background:var(--azul);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 18px;flex-wrap:wrap}
header h2{margin:0;font-size:16px;flex:1}
header .u{font-size:12px;opacity:.85}
header button{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:6px;padding:6px 10px;cursor:pointer}
.layout{display:flex;min-height:calc(100vh - 52px)}
nav{width:210px;background:#fff;border-right:1px solid var(--borda);padding:10px;flex-shrink:0}
nav .t{font-size:11px;text-transform:uppercase;color:#6b7785;margin:12px 6px 4px}
nav a{display:block;padding:7px 10px;border-radius:6px;cursor:pointer;color:var(--txt)}
nav a:hover{background:var(--cinza)}nav a.on{background:var(--azul);color:#fff}
main{flex:1;padding:18px;min-width:0}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px}
.tabs a{padding:7px 14px;border:1px solid var(--borda);border-radius:20px;background:#fff;cursor:pointer}
.tabs a.on{background:var(--azul);color:#fff;border-color:var(--azul)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--borda);border-radius:10px;padding:12px}
.kpi b{display:block;font-size:20px;color:var(--azul)}.kpi span{font-size:12px;color:#6b7785}
table{border-collapse:collapse;width:100%;background:#fff}
th,td{border-bottom:1px solid var(--borda);padding:6px 8px;text-align:left;vertical-align:top}
th{background:#eef1f6;position:sticky;top:0;font-size:12px}
td.n,th.n{text-align:right;white-space:nowrap}
.scroll{overflow:auto;max-height:68vh;border:1px solid var(--borda);border-radius:8px}
.bar{height:8px;background:var(--azul2);border-radius:4px}
.tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;background:#eef1f6}
.tag.p{background:#fff4d6;color:var(--warn)}.tag.a{background:#e6f4ea;color:var(--ok)}.tag.r{background:#fdecea;color:var(--err)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
#wm{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden;opacity:.07;font-weight:700;font-size:18px;color:#000}
#wm div{position:absolute;white-space:nowrap;transform:rotate(-25deg)}
.hide{display:none!important}
.sig{max-width:640px}.sig p{margin:10px 0}
@media(max-width:760px){.layout{flex-direction:column}nav{width:auto;display:flex;flex-wrap:wrap;gap:4px}nav .t{display:none}}
</style>
</head>
<body>
<div id="app"></div>
<div id="wm" class="hide"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
const SUPA_URL='https://hnonemeahbpzkyoqxzbi.supabase.co';
const SUPA_KEY='sb_publishable_ukRWpqLta3n-soS1t1MsoQ_UTSGIMMH';
const sb=supabase.createClient(SUPA_URL,SUPA_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const brl=v=>(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const num=v=>(v||0).toLocaleString('pt-BR');
const dtbr=d=>d?d.split('-').reverse().join('/'):'';
const SETORES={carrao:'Carrão',itaquera:'Itaquera','sao-miguel':'São Miguel',salete:'Salete',centro:'Centro',interlagos:'Interlagos',guaianases:'Guaianases',freguesia:'Freguesia do Ó',jacana:'Jaçanã',lapa:'Lapa',pinheiros:'Pinheiros',leonidas:'Leônidas','santo-amaro':'Santo Amaro'};
const S={perfil:null,setores:[],sel:null,aba:'resumo',cache:{},casas:{},recovery:false,sigilo:false};

/* ---------- inicialização ---------- */
sb.auth.onAuthStateChange((ev,ses)=>{
  if(ev==='PASSWORD_RECOVERY'){S.recovery=true;viewNovaSenha();}
  else if(ev==='SIGNED_OUT'){S.perfil=null;viewLogin();}
});
(async()=>{
  const h=location.hash||'';
  if(/type=(invite|recovery)/.test(h)){S.recovery=true;}
  const {data:{session}}=await sb.auth.getSession();
  if(S.recovery&&session){viewNovaSenha();return;}
  if(session)await entrar();else viewLogin();
})();

function wm(on){
  const w=$('#wm');
  if(!on){w.classList.add('hide');w.innerHTML='';return;}
  const t=esc(S.perfil.email)+' · CONFIDENCIAL · '+new Date().toLocaleDateString('pt-BR');
  let h='';for(let y=-100;y<1100;y+=110)for(let x=-200;x<1800;x+=420)h+=`<div style="top:${y}px;left:${x}px">${t}</div>`;
  w.innerHTML=h;w.classList.remove('hide');
}
/* ---------- telas de acesso ---------- */
function viewLogin(msg){
  wm(false);
  $('#app').innerHTML=`<div class="center"><div class="box card">
  <h1>Regional SP</h1><div style="color:#6b7785">Painel de Ativo Imobilizado — acesso restrito</div>
  <label>E-mail</label><input id="em" type="email" autocomplete="username">
  <label>Senha</label><input id="pw" type="password" autocomplete="current-password">
  <div style="margin-top:14px"><button class="btn" id="go" style="width:100%">Entrar</button></div>
  <div style="margin-top:10px;text-align:center"><a class="lnk" id="esq">Esqueci minha senha</a></div>
  <div id="m" class="msg ${msg?'ok':''}">${esc(msg||'')}</div></div></div>`;
  const m=(t,c)=>{const e=$('#m');e.className='msg '+c;e.textContent=t};
  $('#go').onclick=async()=>{
    const em=$('#em').value.trim(),pw=$('#pw').value;if(!em||!pw)return m('Informe e-mail e senha.','err');
    $('#go').disabled=true;
    const {error}=await sb.auth.signInWithPassword({email:em,password:pw});
    $('#go').disabled=false;
    if(error)return m('E-mail ou senha inválidos.','err');
    await entrar();
  };
  $('#pw').onkeydown=e=>{if(e.key==='Enter')$('#go').click()};
  $('#esq').onclick=async()=>{
    const em=$('#em').value.trim();if(!em)return m('Digite seu e-mail acima e clique novamente.','err');
    await sb.auth.resetPasswordForEmail(em,{redirectTo:location.origin+location.pathname});
    m('Se o e-mail estiver cadastrado, você receberá um link para criar uma nova senha.','ok');
  };
}
function viewNovaSenha(){
  wm(false);
  $('#app').innerHTML=`<div class="center"><div class="box card"><h1>Criar senha</h1>
  <label>Nova senha (mín. 8 caracteres)</label><input id="p1" type="password" autocomplete="new-password">
  <label>Repita a senha</label><input id="p2" type="password" autocomplete="new-password">
  <div style="margin-top:14px"><button class="btn" id="sv" style="width:100%">Salvar senha</button></div><div id="m" class="msg"></div></div></div>`;
  $('#sv').onclick=async()=>{
    const a=$('#p1').value,b=$('#p2').value,m=$('#m');
    if(a.length<8){m.className='msg err';m.textContent='A senha precisa ter ao menos 8 caracteres.';return}
    if(a!==b){m.className='msg err';m.textContent='As senhas não conferem.';return}
    const {error}=await sb.auth.updateUser({password:a});
    if(error){m.className='msg err';m.textContent=error.message;return}
    S.recovery=false;history.replaceState(null,'',location.pathname);await entrar();
  };
}
async function entrar(){
  const {data:{user}}=await sb.auth.getUser();
  if(!user)return viewLogin();
  const {data:p,error}=await sb.from('perfis').select('*').eq('user_id',user.id).maybeSingle();
  if(error||!p||!p.ativo){await sb.auth.signOut();return viewLogin('Seu acesso não está ativo. Fale com o administrador.');}
  S.perfil=p;
  const {data:ps}=await sb.from('perfil_setores').select('setor_id').eq('perfil_id',p.id);
  const {data:all}=await sb.from('setores').select('id,nome').order('nome');
  const mine=new Set((ps||[]).map(x=>x.setor_id));
  S.setores=(all||[]).filter(s=>p.papel!=='usuario'||p.todos_setores||mine.has(s.id));
  S.casas={};
  const {data:cs}=await sb.from('casas').select('setor,casa,nome_casa').limit(2000);
  (cs||[]).forEach(c=>S.casas[c.casa]=c.nome_casa);
  if(S.sigilo)return viewApp();
  viewSigilo();
}
function viewSigilo(){
  wm(true);
  $('#app').innerHTML=`<div class="center"><div class="box card sig"><h1>Termo de sigilo</h1>
  <p>As informações deste painel (bens, valores, localidades e baixas do ativo imobilizado da Regional SP) são <b>confidenciais</b> e de uso exclusivo de pessoas autorizadas.</p>
  <p>É vedado copiar, fotografar, compartilhar ou divulgar o conteúdo a terceiros. Seu acesso é pessoal e intransferível, e cada tela exibe a marca d'água com o seu e-mail.</p>
  <p><label style="font-weight:400"><input type="checkbox" id="ck"> Li e concordo com o termo de sigilo.</label></p>
  <button class="btn" id="ok" disabled>Continuar</button> <button class="btn sec" id="sair">Sair</button></div></div>`;
  $('#ck').onchange=e=>$('#ok').disabled=!e.target.checked;
  $('#ok').onclick=()=>{S.sigilo=true;viewApp()};
  $('#sair').onclick=()=>{S.sigilo=false;sb.auth.signOut()};
}

/* ---------- aplicação ---------- */
const isAdm=()=>S.perfil.papel!=='usuario';
function viewApp(){
  wm(true);
  if(!S.sel)S.sel=S.setores.length>1?'__todos':(S.setores[0]?.id||null);
  const nav=(S.setores.length>1?`<a data-s="__todos">Regional (consolidado)</a>`:'')+S.setores.map(s=>`<a data-s="${s.id}">${esc(s.nome)}</a>`).join('');
  $('#app').innerHTML=`<header><h2>Regional SP — Ativo Imobilizado</h2><span class="u">${esc(S.perfil.email)} · ${S.perfil.papel==='admin1'?'Administrador':S.perfil.papel==='admin'?'Administrador':'Consulta'}</span><button id="sair">Sair</button></header>
  <div class="layout"><nav><div class="t">Setores</div>${nav}<div class="t">Dados</div><a data-s="__enviar">Enviar relatório</a>${isAdm()?'<a data-s="__fila">Aprovações</a><a data-s="__acessos">Acessos</a>':''}</nav><main id="main"></main></div>`;
  $('#sair').onclick=()=>{S.sigilo=false;S.cache={};sb.auth.signOut()};
  document.querySelectorAll('nav a').forEach(a=>a.onclick=()=>{S.sel=a.dataset.s;S.aba='resumo';render()});
  render();
}
function render(){
  document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.s===S.sel));
  const m=$('#main');
  if(S.sel==='__enviar')return viewEnviar(m);
  if(S.sel==='__fila')return viewFila(m);
  if(S.sel==='__acessos')return viewAcessos(m);
  if(!S.sel){m.innerHTML='<div class="card">Nenhum setor liberado para o seu acesso.</div>';return}
  const abas=[['resumo','Resumo'],['contas','Por conta'],['casas','Por casa'],['bens','Bens'],['baixas','Baixas']];
  m.innerHTML=`<h2 style="margin-top:0">${S.sel==='__todos'?'Regional (consolidado)':esc(SETORES[S.sel]||S.sel)}</h2>
  <div class="tabs">${abas.map(a=>`<a data-a="${a[0]}" class="${S.aba===a[0]?'on':''}">${a[1]}</a>`).join('')}</div><div id="conteudo"></div>`;
  m.querySelectorAll('.tabs a').forEach(a=>a.onclick=()=>{S.aba=a.dataset.a;render()});
  conteudo();
}
const ids=()=>S.sel==='__todos'?S.setores.map(s=>s.id):[S.sel];
async function carregarBens(setor,prog){
  if(S.cache['b'+setor])return S.cache['b'+setor];
  let out=[],from=0;const N=1000;
  while(true){
    const {data,error}=await sb.from('bens').select('upload_id,setor,casa,codigo,nome,conta,dependencia,fornecedor,doc,dt,vl_aquisicao,vl_deprec,vl_atual,status,uploads!inner(vigente)').eq('setor',setor).eq('uploads.vigente',true).order('id').range(from,from+N-1);
    if(error){alert('Erro ao carregar: '+error.message);break}
    out=out.concat(data);if(prog)prog(out.length);
    if(data.length<N)break;from+=N;
  }
  return S.cache['b'+setor]=out;
}
async function todosBens(){
  const p=$('#conteudo');let tot=0;
  const parts=[];
  for(const s of ids()){p.innerHTML=`<div class="card">Carregando ${esc(SETORES[s]||s)}… (${num(tot)} itens)</div>`;parts.push(await carregarBens(s,n=>{p.firstChild.textContent=`Carregando ${SETORES[s]||s}… ${num(n)} itens`}));tot+=parts[parts.length-1].length}
  return parts.flat();
}
const soma=(a,k)=>a.reduce((t,x)=>t+(+x[k]||0),0);
const nomeCasa=c=>S.casas[c]?`${c} — ${S.casas[c]}`:c;
function agrupa(arr,fn){const m={};arr.forEach(x=>{const k=fn(x);(m[k]=m[k]||[]).push(x)});return m}

async function conteudo(){
  const c=$('#conteudo');
  if(S.aba==='baixas')return viewBaixas(c);
  const bens=await todosBens();
  if(!bens.length){c.innerHTML='<div class="card">Nenhum dado aprovado para este setor ainda.</div>';return}
  const kp=`<div class="kpis"><div class="kpi"><b>${num(bens.length)}</b><span>Itens</span></div><div class="kpi"><b>${brl(soma(bens,'vl_aquisicao'))}</b><span>Valor de aquisição</span></div><div class="kpi"><b>${brl(soma(bens,'vl_deprec'))}</b><span>Depreciação acumulada</span></div><div class="kpi"><b>${brl(soma(bens,'vl_atual'))}</b><span>Valor atual</span></div></div>`;
  if(S.aba==='resumo'){
    const g=agrupa(bens,b=>b.status||'—');
    const gs=agrupa(bens,b=>b.setor);
    c.innerHTML=kp+`<div class="card"><b>Por situação</b>${tab(['Situação','Itens','Valor atual'],Object.entries(g).map(([k,v])=>[k,num(v.length),brl(soma(v,'vl_atual'))]),[1,2])}</div>`+
      (S.sel==='__todos'?`<div class="card"><b>Por setor</b>${tab(['Setor','Itens','Aquisição','Valor atual'],Object.entries(gs).sort().map(([k,v])=>[SETORES[k]||k,num(v.length),brl(soma(v,'vl_aquisicao')),brl(soma(v,'vl_atual'))]),[1,2,3])}</div>`:'')+
      `<div class="row"><button class="btn sec" id="exp">Baixar dados (Excel)</button></div>`;
    $('#exp').onclick=()=>exportar(bens);
  }else if(S.aba==='contas'){
    const g=agrupa(bens,b=>b.conta||'—');
    c.innerHTML=kp+`<div class="card">${tab(['Conta','Itens','Aquisição','Depreciação','Valor atual'],Object.entries(g).sort().map(([k,v])=>[k,num(v.length),brl(soma(v,'vl_aquisicao')),brl(soma(v,'vl_deprec')),brl(soma(v,'vl_atual'))]),[1,2,3,4])}</div>`;
  }else if(S.aba==='casas'){
    const g=agrupa(bens,b=>b.casa||'—');
    const rows=Object.entries(g).map(([k,v])=>[nomeCasa(k),v.length,soma(v,'vl_atual'),soma(v,'vl_aquisicao')]).sort((a,b)=>b[2]-a[2]);
    const mx=Math.max(...rows.map(r=>r[2]),1);
    c.innerHTML=kp+`<div class="scroll"><table><tr><th>Casa de oração / localidade</th><th class="n">Itens</th><th class="n">Aquisição</th><th class="n">Valor atual</th><th style="width:20%"></th></tr>${rows.map(r=>`<tr><td>${esc(r[0])}</td><td class="n">${num(r[1])}</td><td class="n">${brl(r[3])}</td><td class="n">${brl(r[2])}</td><td><div class="bar" style="width:${Math.max(2,r[2]/mx*100)}%"></div></td></tr>`).join('')}</table></div>`;
  }else if(S.aba==='bens'){
    c.innerHTML=`<div class="row"><input id="q" placeholder="Buscar por código, nome, casa, fornecedor…" style="min-width:280px"><select id="st"><option value="">Todas as situações</option>${[...new Set(bens.map(b=>b.status))].map(s=>`<option>${esc(s)}</option>`).join('')}</select><button class="btn sec" id="exp">Baixar (Excel)</button><span id="cnt"></span></div><div class="scroll" id="tb"></div>`;
    const draw=()=>{
      const q=$('#q').value.toLowerCase(),st=$('#st').value;
      const f=bens.filter(b=>(!st||b.status===st)&&(!q||[b.codigo,b.nome,b.casa,S.casas[b.casa],b.fornecedor,b.dependencia].join(' ').toLowerCase().includes(q)));
      $('#cnt').textContent=`${num(f.length)} itens`+(f.length>300?' (mostrando 300)':'');
      $('#tb').innerHTML=`<table><tr><th>Código</th><th>Nome</th><th>Casa</th><th>Conta</th><th>Dependência</th><th>Data</th><th class="n">Aquisição</th><th class="n">Valor atual</th><th>Situação</th></tr>${f.slice(0,300).map(b=>`<tr><td>${esc(b.codigo)}</td><td>${esc(b.nome)}</td><td>${esc(nomeCasa(b.casa))}</td><td>${esc(b.conta)}</td><td>${esc(b.dependencia)}</td><td>${dtbr(b.dt)}</td><td class="n">${brl(b.vl_aquisicao)}</td><td class="n">${brl(b.vl_atual)}</td><td>${esc(b.status)}</td></tr>`).join('')}</table>`;
      $('#exp').onclick=()=>exportar(f);
    };
    $('#q').oninput=draw;$('#st').onchange=draw;draw();
  }
}
function tab(h,rows,right=[]){return `<div class="scroll"><table><tr>${h.map((x,i)=>`<th class="${right.includes(i)?'n':''}">${x}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map((x,i)=>`<td class="${right.includes(i)?'n':''}">${esc(x)}</td>`).join('')}</tr>`).join('')}</table></div>`}
function exportar(arr){
  const rows=arr.map(b=>({Setor:SETORES[b.setor]||b.setor,Casa:b.casa,'Nome da casa':S.casas[b.casa]||'',Código:b.codigo,Nome:b.nome,Conta:b.conta,Dependência:b.dependencia,Fornecedor:b.fornecedor,Documento:b.doc,'Data aquisição':dtbr(b.dt),'Vl. aquisição':b.vl_aquisicao,'Vl. depreciação':b.vl_deprec,'Vl. atual':b.vl_atual,Situação:b.status}));
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),'Bens');
  XLSX.writeFile(wb,'imobilizado_'+(S.sel||'regional')+'.xlsx');
}
async function viewBaixas(c){
  c.innerHTML='<div class="card">Carregando baixas…</div>';
  let out=[],from=0;
  while(true){
    const {data,error}=await sb.from('baixas').select('setor,dados,uploads!inner(vigente)').in('setor',ids()).eq('uploads.vigente',true).range(from,from+999);
    if(error){c.innerHTML='<div class="card">Erro: '+esc(error.message)+'</div>';return}
    out=out.concat(data);if(data.length<1000)break;from+=1000;
  }
  if(!out.length){c.innerHTML='<div class="card">Nenhuma baixa aprovada para este setor.</div>';return}
  const d=out.map(x=>({setor:x.setor,...x.dados}));
  c.innerHTML=`<div class="kpis"><div class="kpi"><b>${num(d.length)}</b><span>Itens baixados</span></div><div class="kpi"><b>${brl(soma(d,'vl_aquisicao'))}</b><span>Valor de aquisição</span></div><div class="kpi"><b>${brl(soma(d,'vl_atual'))}</b><span>Valor atual na baixa</span></div></div>
  <div class="row"><button class="btn sec" id="exp">Baixar (Excel)</button></div><div class="scroll"><table><tr><th>Setor</th><th>Casa</th><th>Código</th><th>Nome</th><th>Conta</th><th>Dt. baixa</th><th class="n">Aquisição</th><th class="n">Valor atual</th></tr>${d.slice(0,500).map(b=>`<tr><td>${esc(SETORES[b.setor]||b.setor)}</td><td>${esc(nomeCasa(b.casa))}</td><td>${esc(b.codigo)}</td><td>${esc(b.nome)}</td><td>${esc(b.conta)}</td><td>${dtbr(b.dt_baixa)}</td><td class="n">${brl(b.vl_aquisicao)}</td><td class="n">${brl(b.vl_atual)}</td></tr>`).join('')}</table></div>${d.length>500?'<p>Mostrando 500 de '+num(d.length)+'. Use o Excel para ver todos.</p>':''}`;
  $('#exp').onclick=()=>{const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(d),'Baixas');XLSX.writeFile(wb,'baixas_'+S.sel+'.xlsx')};
}
/* ---------- leitura dos relatórios ---------- */
const lerArq=f=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsArrayBuffer(f)});
const dISO=v=>{if(!v)return null;if(v instanceof Date&&!isNaN(v))return new Date(v.getTime()+12*3600e3).toISOString().slice(0,10);if(typeof v==='string'){const m=v.match(/(\d{2})\/(\d{2})\/(\d{4})/);return m?`${m[3]}-${m[2]}-${m[1]}`:null}return null};
const nu=v=>typeof v==='number'?v:(parseFloat(String(v||'0').replace(/\./g,'').replace(',','.'))||0);
async function lerBens(file,setor){
  const wb=XLSX.read(await lerArq(file),{type:'array',cellDates:true});
  const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:''});
  let h=rows.findIndex(r=>String(r[0]).trim()==='Código');if(h<0)throw new Error('Cabeçalho "Código" não encontrado. É o Relatório de Bens Imobilizado?');
  const out=[];
  for(let i=h+1;i<rows.length;i++){
    const r=rows[i];const cod=String(r[0]||'').trim();if(!cod||!/\d/.test(cod))continue;
    const casa=String(r[10]||'').trim();
    out.push({setor,casa,nome_casa:null,codigo:cod,nome:String(r[3]||'').trim(),conta:String(r[11]||'').trim(),dependencia:String(r[15]||'').trim(),fornecedor:String(r[6]||'').trim(),doc:String(r[13]||'').trim(),dt:dISO(r[19]),vl_aquisicao:nu(r[21]),vl_deprec:nu(r[22]),vl_atual:nu(r[27]),status:String(r[31]||'').trim()});
  }
  return out;
}
async function lerBaixas(file){
  const wb=XLSX.read(await lerArq(file),{type:'array',cellDates:true});
  const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:''});
  const h=rows.findIndex(r=>String(r[0]).trim()==='Código');if(h<0)throw new Error('Cabeçalho "Código" não encontrado na planilha de baixas.');
  const mapa={'Setor':'setor_nome'};const out=[];
  for(let i=h+1;i<rows.length;i++){
    const r=rows[i];const cod=String(r[0]||'').trim();if(!cod)continue;
    out.push({setor_nome:String(r[33]||'').trim(),casa:String(r[10]||'').trim(),codigo:cod,nome:String(r[3]||'').trim(),fornecedor:String(r[6]||'').trim(),conta:String(r[11]||'').trim(),doc:String(r[13]||'').trim(),dependencia:String(r[15]||'').trim(),dt_baixa:dISO(r[19]),vl_aquisicao:nu(r[21]),vl_deprec:nu(r[22]),vl_atual:nu(r[27]),status:String(r[31]||'').trim()});
  }
  return out;
}
const slugSetor=n=>{const t=n.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();if(t.startsWith('freg'))return 'freguesia';if(t.startsWith('sao m'))return 'sao-miguel';if(t.startsWith('santo'))return 'santo-amaro';if(t.startsWith('leon'))return 'leonidas';if(t.startsWith('jaca'))return 'jacana';return t.replace(/\s+/g,'-')};

/* ---------- envio ---------- */
async function viewEnviar(m){
  const opts=S.setores.map(s=>`<option value="${s.id}">${esc(s.nome)}</option>`).join('');
  m.innerHTML=`<h2 style="margin-top:0">Enviar relatório</h2>
  <div class="card"><p style="margin-top:0">Envie o arquivo do setor (.xls ou .xlsx). Após o envio, <b>só você</b> verá a prévia, marcada como <i>aguardando aprovação</i>. Os demais usuários continuam vendo a última versão aprovada até um administrador aprovar.</p>
  <div class="row"><select id="tp"><option value="bens">Relatório de Bens Imobilizado</option><option value="baixas">Planilha de baixas</option></select><select id="se">${opts}</select><input type="file" id="fl" accept=".xls,.xlsx"><button class="btn" id="go">Enviar</button></div><div id="msg"></div></div>
  <h3>Meus envios</h3><div id="meus"></div>`;
  $('#tp').onchange=()=>$('#se').disabled=$('#tp').value==='baixas';
  $('#go').onclick=async()=>{
    const f=$('#fl').files[0],tipo=$('#tp').value,setor=$('#se').value,ms=$('#msg');
    if(!f){ms.innerHTML='<div class="msg err">Escolha um arquivo.</div>';return}
    $('#go').disabled=true;
    try{
      ms.innerHTML='<div class="msg ok" style="display:block">Lendo o arquivo…</div>';
      if(tipo==='bens'){
        const it=await lerBens(f,setor);if(!it.length)throw new Error('Nenhum item encontrado no arquivo.');
        await gravar(setor,'bens',f.name,it,ms);
      }else{
        const it=await lerBaixas(f);if(!it.length)throw new Error('Nenhuma baixa encontrada.');
        const g=agrupa(it,x=>slugSetor(x.setor_nome));
        const ok=Object.keys(g).filter(k=>S.setores.some(s=>s.id===k));
        for(const k of ok)await gravar(k,'baixas',f.name,g[k],ms);
        const fora=Object.keys(g).filter(k=>!ok.includes(k));
        if(fora.length)ms.innerHTML+=`<div class="msg err">Setores sem permissão ignorados: ${esc(fora.join(', '))}</div>`;
      }
      ms.innerHTML='<div class="msg ok" style="display:block">Enviado! A prévia está disponível só para você até a aprovação.</div>';
      meusEnvios();
    }catch(e){ms.innerHTML=`<div class="msg err">${esc(e.message||e)}</div>`}
    $('#go').disabled=false;
  };
  $('#se').disabled=false;meusEnvios();
}
async function gravar(setor,tipo,nome,itens,ms){
  const {data:up,error}=await sb.from('uploads').insert({setor,tipo,enviado_por:S.perfil.user_id,arquivo_nome:nome,qtd_itens:itens.length,status:'pendente',vigente:false}).select().single();
  if(error)throw error;
  const tb=tipo==='bens'?'bens':'baixas';
  for(let i=0;i<itens.length;i+=500){
    const lote=itens.slice(i,i+500).map(x=>tipo==='bens'?{...x,upload_id:up.id,setor}:{upload_id:up.id,setor,dados:x});
    const {error:e}=await sb.from(tb).insert(lote);
    if(e){await sb.rpc('cancelar_upload',{p_id:up.id});throw e}
    ms.innerHTML=`<div class="msg ok" style="display:block">${esc(SETORES[setor]||setor)}: enviando ${Math.min(i+500,itens.length)} de ${itens.length}…</div>`;
  }
  return up;
}
async function meusEnvios(){
  const {data}=await sb.from('uploads').select('*').eq('enviado_por',S.perfil.user_id).order('enviado_em',{ascending:false}).limit(30);
  const t={pendente:['p','Aguardando aprovação'],aprovado:['a','Aprovado'],rejeitado:['r','Rejeitado'],substituido:['','Substituído'],cancelado:['','Cancelado']};
  $('#meus').innerHTML=(data||[]).length?`<div class="scroll"><table><tr><th>Data</th><th>Setor</th><th>Tipo</th><th>Arquivo</th><th class="n">Itens</th><th>Situação</th><th></th></tr>${data.map(u=>`<tr><td>${new Date(u.enviado_em).toLocaleString('pt-BR')}</td><td>${esc(SETORES[u.setor]||u.setor)}</td><td>${u.tipo}</td><td>${esc(u.arquivo_nome)}</td><td class="n">${num(u.qtd_itens)}</td><td><span class="tag ${t[u.status][0]}">${t[u.status][1]}</span>${u.motivo?'<br><small>Motivo: '+esc(u.motivo)+'</small>':''}</td><td>${u.status==='pendente'&&u.tipo==='bens'?`<a class="lnk" data-p="${u.id}" data-s="${u.setor}">ver prévia</a>`:''}</td></tr>`).join('')}</table></div><div id="prev"></div>`:'<div class="card">Nenhum envio ainda.</div>';
  document.querySelectorAll('[data-p]').forEach(a=>a.onclick=()=>prévia(a.dataset.p,a.dataset.s,$('#prev')));
}
async function itensUpload(id){
  let out=[],from=0;
  while(true){const {data,error}=await sb.from('bens').select('codigo,nome,casa,conta,vl_aquisicao,vl_deprec,vl_atual,status').eq('upload_id',id).order('id').range(from,from+999);
    if(error)throw error;out=out.concat(data);if(data.length<1000)break;from+=1000}
  return out;
}
async function prévia(id,setor,el){
  el.innerHTML='<div class="card">Carregando prévia…</div>';
  const novo=await itensUpload(id);
  const {data:vig}=await sb.from('uploads').select('id').eq('setor',setor).eq('tipo','bens').eq('vigente',true).maybeSingle();
  const ant=vig?await itensUpload(vig.id):[];
  const mk=a=>{const m=new Map();a.forEach(x=>m.set(x.codigo,x));return m};
  const mn=mk(novo),ma=mk(ant);
  const add=[...mn.keys()].filter(k=>!ma.has(k)),rem=[...ma.keys()].filter(k=>!mn.has(k));
  const alt=[...mn.keys()].filter(k=>ma.has(k)&&(Math.abs(mn.get(k).vl_atual-ma.get(k).vl_atual)>.005||mn.get(k).casa!==ma.get(k).casa||mn.get(k).status!==ma.get(k).status));
  const lin=(k,src)=>{const x=src.get(k),y=ma.get(k);return `<tr><td>${esc(k)}</td><td>${esc(x.nome)}</td><td>${esc(nomeCasa(x.casa))}</td><td class="n">${y&&src===mn?brl(y.vl_atual)+' → ':''}${brl(x.vl_atual)}</td></tr>`};
  el.innerHTML=`<div class="card"><h3 style="margin-top:0">Prévia — ${esc(SETORES[setor]||setor)} <span class="tag p">aguardando aprovação</span></h3>
  <div class="kpis"><div class="kpi"><b>${num(novo.length)}</b><span>Itens (aprovado hoje: ${num(ant.length)})</span></div><div class="kpi"><b>${brl(soma(novo,'vl_atual'))}</b><span>Valor atual (aprovado: ${brl(soma(ant,'vl_atual'))})</span></div><div class="kpi"><b>${num(add.length)} / ${num(rem.length)} / ${num(alt.length)}</b><span>Novos / removidos / alterados</span></div></div>
  ${[['Novos itens',add,mn],['Itens removidos',rem,ma],['Itens alterados',alt,mn]].map(([t,l,src])=>l.length?`<details><summary>${t} (${num(l.length)})</summary><div class="scroll"><table><tr><th>Código</th><th>Nome</th><th>Casa</th><th class="n">Valor atual</th></tr>${l.slice(0,300).map(k=>lin(k,src)).join('')}</table></div>${l.length>300?'<small>Primeiros 300.</small>':''}</details>`:'').join('')}
  </div>`;
}

/* ---------- aprovações ---------- */
async function viewFila(m){
  m.innerHTML='<h2 style="margin-top:0">Aprovações pendentes</h2><div id="fila">Carregando…</div><div id="prev"></div>';
  const {data}=await sb.from('uploads').select('*').eq('status','pendente').order('enviado_em');
  const {data:pf}=await sb.from('perfis').select('user_id,email');const em={};(pf||[]).forEach(p=>em[p.user_id]=p.email);
  $('#fila').innerHTML=(data||[]).length?`<div class="scroll"><table><tr><th>Enviado</th><th>Por</th><th>Setor</th><th>Tipo</th><th>Arquivo</th><th class="n">Itens</th><th>Ações</th></tr>${data.map(u=>`<tr><td>${new Date(u.enviado_em).toLocaleString('pt-BR')}</td><td>${esc(em[u.enviado_por]||'')}</td><td>${esc(SETORES[u.setor]||u.setor)}</td><td>${u.tipo}</td><td>${esc(u.arquivo_nome)}</td><td class="n">${num(u.qtd_itens)}</td><td>${u.tipo==='bens'?`<a class="lnk" data-p="${u.id}" data-s="${u.setor}">comparar</a> · `:''}<a class="lnk" data-ap="${u.id}">aprovar</a> · <a class="lnk" data-rj="${u.id}">rejeitar</a></td></tr>`).join('')}</table></div>`:'<div class="card">Nenhum envio aguardando aprovação.</div>';
  document.querySelectorAll('[data-p]').forEach(a=>a.onclick=()=>prévia(a.dataset.p,a.dataset.s,$('#prev')));
  document.querySelectorAll('[data-ap]').forEach(a=>a.onclick=async()=>{
    if(!confirm('Aprovar este envio? Ele passará a valer para todos os usuários do setor.'))return;
    const {error}=await sb.rpc('aprovar_upload',{p_id:a.dataset.ap});if(error)return alert(error.message);S.cache={};viewFila(m)});
  document.querySelectorAll('[data-rj]').forEach(a=>a.onclick=async()=>{
    const mo=prompt('Motivo da rejeição (o usuário verá este texto):');if(!mo)return;
    const {error}=await sb.rpc('rejeitar_upload',{p_id:a.dataset.rj,p_motivo:mo});if(error)return alert(error.message);viewFila(m)});
}

/* ---------- gestão de acessos ---------- */
async function viewAcessos(m){
  m.innerHTML='<h2 style="margin-top:0">Gestão de acessos</h2><div id="ac">Carregando…</div>';
  const [{data:pf},{data:ps}]=await Promise.all([sb.from('perfis').select('*').order('papel').order('email'),sb.from('perfil_setores').select('*')]);
  const pa=S.perfil.papel==='admin1';
  const set=id=>(ps||[]).filter(x=>x.perfil_id===id).map(x=>x.setor_id);
  const podeEd=p=>pa||p.papel==='usuario';
  $('#ac').innerHTML=`<div class="card"><b>Novo acesso</b>
  <div class="row" style="margin-top:8px"><input id="ne" type="email" placeholder="e-mail" style="min-width:240px"><input id="nn" placeholder="nome"><select id="np"><option value="usuario">Consulta</option>${pa?'<option value="admin">Administrador (ADM 2/3)</option>':''}</select></div>
  <div class="row"><label><input type="checkbox" id="nt"> Todos os setores</label></div>
  <div class="row" id="nss">${S.setores.map(s=>`<label><input type="checkbox" value="${s.id}"> ${esc(s.nome)}</label>`).join(' ')}</div>
  <button class="btn" id="add">Cadastrar e enviar convite</button><div id="am"></div></div>
  <div class="scroll"><table><tr><th>E-mail</th><th>Nome</th><th>Papel</th><th>Setores</th><th>Situação</th><th></th></tr>${(pf||[]).map(p=>`<tr><td>${esc(p.email)}</td><td>${esc(p.nome||'')}</td><td>${p.papel==='admin1'?'ADM 1':p.papel==='admin'?'Administrador':'Consulta'}</td><td>${p.papel!=='usuario'||p.todos_setores?'Todos':esc(set(p.id).map(x=>SETORES[x]||x).join(', ')||'—')}</td><td>${p.ativo?'<span class="tag a">Ativo</span>':'<span class="tag r">Desativado</span>'}</td><td>${podeEd(p)&&p.papel!=='admin1'?`<a class="lnk" data-ed="${p.id}">editar</a> · <a class="lnk" data-at="${p.id}" data-v="${p.ativo}">${p.ativo?'desativar':'ativar'}</a> · <a class="lnk" data-cv="${p.email}">reenviar convite</a>`:''}</td></tr>`).join('')}</table></div>`;
  const msg=(t,c)=>$('#am').innerHTML=`<div class="msg ${c}">${esc(t)}</div>`;
  $('#add').onclick=async()=>{
    const e=$('#ne').value.trim().toLowerCase();if(!e)return msg('Informe o e-mail.','err');
    const sel=[...document.querySelectorAll('#nss input:checked')].map(x=>x.value);const todos=$('#nt').checked;
    if($('#np').value==='usuario'&&!todos&&!sel.length)return msg('Escolha ao menos um setor ou marque "Todos".','err');
    const {error}=await sb.rpc('salvar_perfil',{p_email:e,p_nome:$('#nn').value.trim(),p_papel:$('#np').value,p_todos:todos,p_setores:sel,p_ativo:true});
    if(error)return msg(error.message,'err');
    const r=await convidar(e);msg(r,r.startsWith('Convite')?'ok':'err');setTimeout(()=>viewAcessos(m),1800);
  };
  document.querySelectorAll('[data-at]').forEach(a=>a.onclick=async()=>{
    const p=pf.find(x=>x.id===a.dataset.at);
    const {error}=await sb.rpc('salvar_perfil',{p_email:p.email,p_nome:p.nome||'',p_papel:p.papel,p_todos:p.todos_setores,p_setores:set(p.id),p_ativo:a.dataset.v!=='true'});
    if(error)alert(error.message);viewAcessos(m)});
  document.querySelectorAll('[data-cv]').forEach(a=>a.onclick=async()=>alert(await convidar(a.dataset.cv)));
  document.querySelectorAll('[data-ed]').forEach(a=>a.onclick=async()=>{
    const p=pf.find(x=>x.id===a.dataset.ed);
    const atual=set(p.id);
    const novo=prompt('Setores liberados (separe por vírgula) ou escreva TODOS.\nOpções: '+Object.keys(SETORES).join(', '),p.todos_setores?'TODOS':atual.join(','));
    if(novo===null)return;
    const todos=novo.trim().toUpperCase()==='TODOS';
    const lista=todos?[]:novo.split(',').map(x=>x.trim()).filter(x=>SETORES[x]);
    const {error}=await sb.rpc('salvar_perfil',{p_email:p.email,p_nome:p.nome||'',p_papel:p.papel,p_todos:todos,p_setores:lista,p_ativo:p.ativo});
    if(error)alert(error.message);viewAcessos(m)});
}
async function convidar(email){
  const {data,error}=await sb.functions.invoke('convidar',{body:{email,redirectTo:location.origin+location.pathname}});
  if(error||data?.error)return 'Cadastro salvo, mas o convite falhou: '+(data?.error||error.message);
  return 'Convite enviado para '+email+'.';
}
</script>
